    <script>
      // Runs before paint so there's no flash of the wrong theme. Only
      // ever sets a value a person actually chose — if nothing is
      // stored, the CSS media query below decides from prefers-color-scheme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* localStorage unavailable — fall back to prefers-color-scheme */
        }
      })();
    </script>
